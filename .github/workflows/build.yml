name: Build and publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Caddy version (2, 2.11 or 2.11.4)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/burtek/caddy-cloudflare

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Resolve Caddy version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          versions=$(
            gh release list --repo caddyserver/caddy --limit 100 --exclude-pre-releases |
            awk '{print $1}' |
            sed 's/^v//'
          )

          resolved=$(printf '%s\n' "$versions" | grep -E "^${REQUESTED//./\\.}(\.|$)" | head -n1)

          if [ -z "$resolved" ]; then
            echo "::error::Could not resolve Caddy version '${REQUESTED}'"
            exit 1
          fi

          major=$(echo "$resolved" | cut -d. -f1)
          minor=$(echo "$resolved" | cut -d. -f1-2)

          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --build-arg CADDY_VERSION=${{ steps.version.outputs.resolved }} \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t $IMAGE:${{ steps.version.outputs.resolved }}-alpine \
            .

      - name: Verify Cloudflare module
        run: |
          docker run --rm \
            $IMAGE:${{ steps.version.outputs.resolved }}-alpine \
            caddy list-modules | grep '^dns.providers.cloudflare$'

      - name: Tag image
        run: |
          docker tag \
            $IMAGE:${{ steps.version.outputs.resolved }}-alpine \
            $IMAGE:${{ steps.version.outputs.minor }}-alpine

          docker tag \
            $IMAGE:${{ steps.version.outputs.resolved }}-alpine \
            $IMAGE:${{ steps.version.outputs.major }}-alpine

      - name: Push image
        run: |
          docker push $IMAGE:${{ steps.version.outputs.resolved }}-alpine
          docker push $IMAGE:${{ steps.version.outputs.minor }}-alpine
          docker push $IMAGE:${{ steps.version.outputs.major }}-alpine
